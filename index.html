<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangaw</title>
<link rel="icon" href="logo.png" type="image/png">
<style>
  :root { --bg: #ffffff; --text: #14181a; --muted: #5b6560; --accent: #1f9d55; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1211; --text: #eef1ef; --muted: #9aa5a0; --accent: #3ecf8e; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 20px; }
  img { width: 56px; height: 56px; border-radius: 14px; display: block; }
  h1 { font-size: 30px; margin: 18px 0 6px; }
  p { color: var(--muted); margin: 0 0 14px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <img src="logo.png" alt="Hangaw">
  <h1>Hangaw</h1>
  <p>A calorie and nutrition tracker, available on Google Play.</p>
  <p><a href="delete-account.html">Delete your Hangaw account</a></p>
  <p>Questions: <a href="mailto:hangaw.support@gmail.com">hangaw.support@gmail.com</a></p>
</div>
</body>
</html>
